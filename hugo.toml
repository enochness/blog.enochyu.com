baseURL = 'https://blog.enochyu.com'
locale = 'en-us'
title = "Enoch Yu's Blog"

enableRobotsTXT = true

[params]
  author = "Enoch Yu"
  avatar = "/avatar.png"
  mainSections = ["posts"]
  favicon = "/favicon/favicon.ico"
  math = true

[params.social]
  website = "https://enochyu.com/"
  youtube = "https://www.youtube.com/channel/enochness"
  github = "https://github.com/enochness"

[params.comments]
  api = "https://blog.enochyu.com/api/comments"
  site = "blog"
  turnstile = "0x4AAAAAAF8hI3sEHSj440sV"

[outputs]
  home = ["html", "rss", "threads"]

[outputFormats.threads]
  mediaType = "application/json"
  baseName = "comment-threads"
  isPlainText = true
  notAlternative = true

[taxonomies]
  category = "categories"
  tag      = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.highlight]

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Archives"
  url = "/archives/"
  weight = 2

